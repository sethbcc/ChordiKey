<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChordiKey UI</title>
  
  <!-- Iconify Script -->
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&family=Shrikhand&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 12px 12px 0 12px;
    }

    /* --- STRICT HIDDEN UTILITY --- */
    .hidden {
      display: none !important;
    }

    /* --- MAIN TOP BAR HEADER --- */
    .top-bar {
      display: flex;
      align-items: center;
      height: 60px;
      width: 100%;
      gap: 12px;
      flex-shrink: 0;
    }

    /* --- LOGO CONTAINER --- */
    .logo-container {
      width: 220px;
      height: 100%;
      background-color: #212529;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Shrikhand', cursive !important;
      font-size: 29.5px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .logo span {
      font-family: 'Shrikhand', cursive !important;
    } 

    .logo span.chord { color: #ffffff; }
    .logo span.i { color: #ffde59; }  
    .logo span.key { color: #6edad6; }

    /* --- FLOATING OUTER RIGHT BAR --- */
    .top-bar-right {
      flex: 1;
      height: 100%;
      background-color: #26262a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }

    /* --- INNER SEARCH PILL BOX --- */
    .search-bar {
      background-color: #3f4045;
      height: 42px;
      width: 380px;
      border-radius: 21px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #c5c6c9;
      font-size: 16px;
      font-weight: 400;
      width: 85%;
    }

    .search-bar input::placeholder {
      color: #9a9b9e;
    }

    .search-bar iconify-icon {
      font-size: 22px;
      color: #ffffff;
      flex-shrink: 0;
    }

    /* --- MAIN APP CONTAINER --- */
    .main-container {
      display: flex;
      flex: 1;
      padding: 12px 0;
      gap: 12px;
      min-height: 0;
    }

    /* --- FLOATING SIDEBAR --- */
    .sidebar {
      width: 196px;
      background-color: #2c2d30;
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      transition: background 0.2s;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .nav-item.active {
      background-color: #6c6d70;
    }

    .nav-item iconify-icon {
      font-size: 22px;
      color: #ffffff;
      flex-shrink: 0;
    }

    /* --- CONTENT AREA --- */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }

    .page-view {
      display: none;
      height: 100%;
      width: 100%;
    }

    .page-view.active {
      display: flex;
      flex-direction: column;
    }

    /* --- SCROLLABLE CREATE CONTAINER --- */
    .create-container {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 24px;
      padding: 4px 12px 24px 0;
      overflow-y: auto;
      height: 100%;
      width: 100%;
      scrollbar-width: thin;
      scrollbar-color: #4f4f52 transparent;
    }

    .create-container::-webkit-scrollbar {
      width: 6px;
    }

    .create-container::-webkit-scrollbar-thumb {
      background-color: #4f4f52;
      border-radius: 10px;
    }

    .project-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background-color: #1a1a1c;
      padding: 12px 16px 12px 12px;
      border-radius: 24px;
      position: relative;
    }

    .new-project-card, .saved-project-card {
      width: 120px;
      height: 120px;
      background-color: #4f4f52;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      flex-shrink: 0;
    }

    .saved-project-card {
      background-color: #27272a;
    }

    .new-project-card:hover, .saved-project-card:hover {
      transform: scale(1.02);
    }

    .new-project-card iconify-icon {
      font-size: 56px;
      color: #ffffff;
    }

    .saved-project-card iconify-icon {
      font-size: 52px;
      color: #6edad6;
    }

    .project-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 120px;
    }

    .project-details .project-name {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }

    .project-details .project-date {
      font-size: 18px;
      font-weight: 600;
      color: #d1d2d5;
    }

    /* DELETE BUTTON */
    .delete-project-btn {
      background: transparent;
      border: none;
      outline: none;
      color: #ff5555;
      cursor: pointer;
      padding: 8px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, color 0.2s;
      margin-left: 8px;
    }

    .delete-project-btn:hover {
      background-color: rgba(255, 85, 85, 0.15);
      color: #ff7777;
    }

    .delete-project-btn iconify-icon {
      font-size: 26px;
    }

    /* --- RECOLORED RED CLOSE SUBVIEW X BUTTON --- */
    .close-subview-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background-color: #ff3b30;
      border: none;
      outline: none;
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 10px rgba(255, 59, 48, 0.3);
    }

    .close-subview-btn:hover {
      background-color: #ff1a0c;
      transform: scale(1.08);
    }

    .close-subview-btn iconify-icon {
      font-size: 24px;
    }

    /* --- CENTERED FILE FORM CARD VIEW --- */
    .file-subview-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
    }

    .file-form-card {
      position: relative;
      background-color: #27272a;
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      padding: 36px 36px 32px 36px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .file-form-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 18px;
    }

    .file-name-input {
      width: 100%;
      height: 52px;
      background-color: #4b4c50;
      border: none;
      outline: none;
      border-radius: 16px;
      padding: 0 22px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .file-name-input::placeholder {
      color: #b0b1b5;
      font-weight: 700;
    }

    .create-file-btn {
      align-self: flex-end;
      background-color: #2faf0a;
      color: #ffffff;
      border: none;
      outline: none;
      border-radius: 16px;
      padding: 12px 28px;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .create-file-btn:hover {
      background-color: #38c80d;
      transform: scale(1.02);
    }

    /* --- PIANO EDITOR VIEW --- */
    .editor-subview-wrapper {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .piano-editor-card {
      position: relative;
      background-color: #535353;
      border-radius: 20px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .active-project-banner {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.4);
      padding: 8px 18px;
      border-radius: 12px;
      z-index: 5;
    }

    .piano-keyboard-strip {
      width: 100%;
      height: 230px;
      background-color: #ffffff;
      position: relative;
      display: flex;
      touch-action: manipulation;
    }

    .white-key {
      flex: 1;
      height: 100%;
      border-right: 2px solid #2d2d2d;
      background-color: #ffffff;
      cursor: pointer;
      user-select: none;
    }

    .white-key:active, .white-key.active {
      background-color: #e0e0e0;
    }

    .white-key:last-child {
      border-right: none;
    }

    .black-key {
      position: absolute;
      top: 0;
      width: 9.8%;
      height: 60%;
      background-color: #000000;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      z-index: 2;
      cursor: pointer;
      user-select: none;
    }

    .black-key:active, .black-key.active {
      background-color: #333333;
    }

    .black-key.k1 { left: 9.3%; }
    .black-key.k2 { left: 23.6%; }
    .black-key.k3 { left: 52.2%; }
    .black-key.k4 { left: 66.5%; }
    .black-key.k5 { left: 80.8%; }

    /* --- CONFIRM DELETE MODAL --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .modal-card {
      background-color: #27272a;
      border-radius: 20px;
      padding: 28px 28px 24px 28px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid #3f4045;
    }

    .modal-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }

    .modal-text {
      font-size: 16px;
      color: #d1d2d5;
      line-height: 1.4;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 8px;
    }

    .modal-btn {
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    .cancel-btn {
      background-color: #4b4c50;
      color: #ffffff;
    }

    .cancel-btn:hover {
      background-color: #5c5d62;
    }

    .confirm-delete-btn {
      background-color: #ff3b30;
      color: #ffffff;
    }

    .confirm-delete-btn:hover {
      background-color: #ff1a0c;
    }

    /* MOBILE RESPONSIVE RULES */
    @media (max-width: 768px) and (orientation: portrait) {
      body { padding: 8px; }
      .top-bar { height: 50px; gap: 8px; }
      .logo-container { width: 140px; }
      .logo { font-size: 20px; }
      .search-bar { width: 100%; height: 36px; padding: 0 10px; }
      .search-bar input { font-size: 14px; }
      .main-container { flex-direction: column-reverse; padding: 8px 0 0 0; gap: 8px; }
      .sidebar { width: 100%; height: 56px; flex-direction: row; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 14px; overflow-x: auto; flex-shrink: 0; }
      .nav-item { padding: 8px; border-radius: 10px; }
      .nav-item span { display: none; }
      .nav-item iconify-icon { font-size: 24px; }
      .active-project-banner { top: 12px; left: 12px; font-size: 15px; padding: 6px 12px; }
      .close-subview-btn { top: 12px; right: 12px; width: 34px; height: 34px; }
      .piano-keyboard-strip { height: 220px; }
      .file-form-card { width: 92%; padding: 24px; }
      .create-file-btn { width: 100%; font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- Top Bar Header -->
  <header class="top-bar">
    <div class="logo-container">
      <div class="logo">
        <span class="chord">Chord</span><span class="i">i</span><span class="key">Key</span>
      </div>
    </div>

    <div class="top-bar-right">
      <div class="search-bar">
        <input type="text" id="main-search-input" placeholder="Search ChordiKey">
        <iconify-icon icon="mingcute:search-line"></iconify-icon>
      </div>
    </div>
  </header>

  <!-- Main Area with Sidebar and Views -->
  <div class="main-container">
    <nav class="sidebar">
      <a href="#" class="nav-item active" data-target="home-view" data-placeholder="Search ChordiKey">
        <iconify-icon icon="famicons:home"></iconify-icon>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item" data-target="create-view" data-placeholder="Search Projects">
        <iconify-icon icon="gridicons:create"></iconify-icon>
        <span>Create</span>
      </a>
      <a href="#" class="nav-item" data-target="store-view" data-placeholder="Search Store">
        <iconify-icon icon="material-symbols:store-rounded"></iconify-icon>
        <span>Store</span>
      </a>
      <a href="#" class="nav-item" data-target="profile-view" data-placeholder="Search Profile">
        <iconify-icon icon="gg:profile"></iconify-icon>
        <span>Profile</span>
      </a>
      <a href="#" class="nav-item" data-target="friends-view" data-placeholder="Search Friends">
        <iconify-icon icon="fa7-solid:user-friends"></iconify-icon>
        <span>Friends</span>
      </a>
      <a href="#" class="nav-item" data-target="learn-view" data-placeholder="Search Lessons">
        <iconify-icon icon="material-symbols:school-rounded"></iconify-icon>
        <span>Learn</span>
      </a>
      <a href="#" class="nav-item" data-target="subscribe-view" data-placeholder="Search Plans">
        <iconify-icon icon="streamline:subscription-cashflow-solid"></iconify-icon>
        <span>Subscribe</span>
      </a>
      <a href="#" class="nav-item" data-target="settings-view" data-placeholder="Search Settings">
        <iconify-icon icon="material-symbols:settings-rounded"></iconify-icon>
        <span>Settings</span>
      </a>
      <a href="#" class="nav-item" data-target="help-view" data-placeholder="Search Help">
        <iconify-icon icon="material-symbols:help-rounded"></iconify-icon>
        <span>Help</span>
      </a>
    </nav>

    <!-- Content Area Container -->
    <div class="content-area">
      <!-- 1. Home Page View -->
      <div id="home-view" class="page-view active"></div>

      <!-- 2. Create Page View -->
      <div id="create-view" class="page-view">
        
        <!-- Subview A: Scrollable Dynamic Project List View -->
        <div id="create-main-subview" class="create-container"></div>

        <!-- Subview B: Centered File Name Input View -->
        <div id="create-file-subview" class="file-subview-wrapper hidden">
          <div class="file-form-card">
            <button class="close-subview-btn" id="close-file-btn" title="Close">
              <iconify-icon icon="ic:round-close"></iconify-icon>
            </button>
            <label class="file-form-title">Enter file name:</label>
            <input type="text" id="project-name-input" class="file-name-input" placeholder="File name">
            <button class="create-file-btn" id="submit-create-file-btn">Create file</button>
          </div>
        </div>

        <!-- Subview C: Piano Keyboard Editor View -->
        <div id="create-editor-subview" class="editor-subview-wrapper hidden">
          <div class="piano-editor-card">
            <button class="close-subview-btn" id="close-editor-btn" title="Close editor">
              <iconify-icon icon="ic:round-close"></iconify-icon>
            </button>

            <div id="current-project-title" class="active-project-banner">Project: Untitled</div>

            <div class="piano-keyboard-strip">
              <!-- White Keys (C4 to B4) -->
              <div class="white-key" data-freq="261.63"></div>
              <div class="white-key" data-freq="293.66"></div>
              <div class="white-key" data-freq="329.63"></div>
              <div class="white-key" data-freq="349.23"></div>
              <div class="white-key" data-freq="392.00"></div>
              <div class="white-key" data-freq="440.00"></div>
              <div class="white-key" data-freq="493.88"></div>

              <!-- Black Keys (C#4, D#4, F#4, G#4, A#4) -->
              <div class="black-key k1" data-freq="277.18"></div>
              <div class="black-key k2" data-freq="311.13"></div>
              <div class="black-key k3" data-freq="369.99"></div>
              <div class="black-key k4" data-freq="415.30"></div>
              <div class="black-key k5" data-freq="466.16"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Are You Sure Delete Confirmation Modal -->
  <div id="delete-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-title">Delete File?</div>
      <div class="modal-text" id="delete-modal-text">Are you sure you want to delete this file? This action cannot be undone.</div>
      <div class="modal-buttons">
        <button id="cancel-delete-btn" class="modal-btn cancel-btn">Cancel</button>
        <button id="confirm-delete-btn" class="modal-btn confirm-delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <!-- External JavaScript File Link -->
  <script src="script.js"></script>
</body>
</html>
