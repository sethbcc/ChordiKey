<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChordiFlip UI</title>
  
<!-- 1. Iconify Script -->
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  
  <!-- Google Fonts for Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">

  <!-- Add this Google Fonts link inside your <head> tags -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

/* --- MAIN TOP BAR HEADER --- */
.top-bar {
  display: flex;
  align-items: center;
  height: 60px;
  width: 100%;
  gap: 12px;
  padding-right: 12px;
}

/* --- LOGO CONTAINER (Flush to top & left edge) --- */
.logo-container {
  width: 220px;
  height: 100%;
  background-color: #212529;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 0; /* Keeps corners sharp against edges */
  flex-shrink: 0;
}

/* --- FLOATING OUTER RIGHT BAR --- */
.top-bar-right {
  flex: 1;
  height: 100%;
  background-color: #26262a; /* Dark background of the outer bar */
  border-radius: 12px;       /* Floating rounded corners */
  display: flex;
  align-items: center;
  padding: 0 10px;           /* Inset padding for inner search pill */
}

/* --- INNER SEARCH PILL BOX --- */
.search-bar {
  background-color: #3f4045; /* Lighter grey capsule background */
  height: 42px;
  width: 380px;               /* Fixed width to match reference image */
  border-radius: 21px;        /* Fully rounded pill shape */
  display: flex;
  align-items: center;
  padding: 0 16px;
}

.search-bar input {
  background: transparent;
  border: none;
  outline: none;
  color: #c5c6c9;
  font-size: 16px;
  font-weight: 700;
  width: 100%;
}

.search-bar input::placeholder {
  color: #9a9b9e;
}

    .logo {
      font-family: 'Shrikhand', cursive !important;
      font-size: 29.5px;
      font-weight: 700;
      letter-spacing: -0px;
      line-spacing: -1.4px;
    }

    .logo span {
  font-family: inherit;
    } 
      .logo span.chord {
      color: #ffffff;
    }

    .logo span.i {
      color: #ffde59;
    }  

    .logo span.flip {
      color: #6edad6;
    }

    /* --- MAIN APP CONTAINER --- */
    .main-container {
      display: flex;
      flex: 1;
      padding: 12px 12px 12px 12px;
    }

    /* --- FLOATING SIDEBAR --- */
    .sidebar {
      width: 196px;
      background-color: #2c2d30;
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      transition: background 0.2s;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .nav-item.active {
      background-color: #6c6d70;
    }

    /* Styling Iconify Icons inside sidebar */
    .nav-item iconify-icon {
      font-size: 22px;
      color: #ffffff;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Top Bar Layout -->
  <header class="top-bar">
    <div class="logo-container">
      <div class="logo">
        <span class="chord">Chord</span><span class="i">i</span><span class="flip">Flip</span>
      </div>
    </div>
    <div class="search-container">
      <div class="search-bar">
        <input type="text" placeholder="Search ChordiFlip">
      </div>
    </div>
  </header>

<!-- Floating outer top bar -->
  <div class="top-bar-right">
    <!-- Inner search box pill -->
    <div class="search-bar">
      <input type="text" placeholder="Search ChordiFlip">
    </div>
  </div>
</header>

   <!-- MAIN AREA WITH FLOATING SIDEBAR -->
  <div class="main-container">
    <nav class="sidebar">
      <a href="#" class="nav-item active">
        <iconify-icon icon="famicons:home"></iconify-icon>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item">
        <iconify-icon icon="gridicons:create"></iconify-icon>
        <span>Create</span>
      </a>
      <a href="#" class="nav-item">
        <iconify-icon icon="material-symbols:store-rounded"></iconify-icon>
        <span>Store</span>
      </a>
      <a href="#" class="nav-item">
        <iconify-icon icon="gg:profile"></iconify-icon>
        <span>Profile</span>
      </a>
      <a href="#" class="nav-item">
        <iconify-icon icon="fa7-solid:user-friends"></iconify-icon>
        <span>Friends</span>
      </a>
      <a href="#" class="nav-item">
        <iconify-icon icon="material-symbols:school-rounded"></iconify-icon>
        <span>Learn</span>
      </a>
      <a href="#" class="nav-item">
        <iconify-icon icon="streamline:subscription-cashflow-solid"></iconify-icon>
        <span>Subscribe</span>
      </a>
      <a href="#" class="nav-item">
        <iconify-icon icon="material-symbols:settings-rounded"></iconify-icon>
        <span>Settings</span>
      </a>
      <a href="#" class="nav-item">
        <iconify-icon icon="material-symbols:help-rounded"></iconify-icon>
        <span>Help</span>
      </a>
    </nav>
  </div>

</body>
</html>
