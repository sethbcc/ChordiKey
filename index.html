<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChordiFlip UI</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts for Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- TOP NAVBAR --- */
    .top-bar {
      display: flex;
      align-items: center;
      height: 70px;
      width: 100%;
    }

    .logo-container {
      width: 220px;
      height: 100%;
      background-color: #212529;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom-right-radius: 4px;
    }

    .logo {
      font-family: 'Fredoka', sans-serif;
      font-size: 28px;
      font-weight: 700;
      font-style: italic;
      letter-spacing: -0.5px;
    }

    .logo span.chordi {
      color: #ffffff;
    }

    .logo span.flip {
      color: #6edad6;
    }

    .search-container {
      flex: 1;
      height: 100%;
      background-color: #1a1a1a;
      display: flex;
      align-items: center;
      padding-left: 20px;
    }

    .search-bar {
      width: 420px;
      height: 48px;
      background-color: #3b3d3e;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      width: 100%;
    }

    .search-bar input::placeholder {
      color: #a0a0a0;
    }

    /* --- MAIN CONTENT AREA --- */
    .main-container {
      display: flex;
      flex: 1;
    }

    /* --- SIDEBAR --- */
    .sidebar {
      width: 220px;
      background-color: #121314;
      padding: 15px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top-right-radius: 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 16px;
      background-color: #383a3d;
      border-radius: 18px;
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      transition: background-color 0.2s ease, transform 0.1s ease;
      cursor: pointer;
    }

    .nav-item i {
      font-size: 22px;
      width: 26px;
      text-align: center;
    }

    /* Active / Hover state */
    .nav-item.active {
      background-color: #71757a;
    }

    .nav-item:hover:not(.active) {
      background-color: #4a4d52;
    }

    /* --- MAIN BODY CONTENT --- */
    .content-area {
      flex: 1;
      background-color: #000000;
      padding: 30px;
    }
  </style>
</head>
<body>

  <!-- Top Bar Layout -->
  <header class="top-bar">
    <div class="logo-container">
      <div class="logo">
        <span class="chordi">Chordi</span><span class="flip">Flip</span>
      </div>
    </div>
    <div class="search-container">
      <div class="search-bar">
        <input type="text" placeholder="Search ChordiFlip">
      </div>
    </div>
  </header>

  <!-- Main Body Layout -->
  <div class="main-container">
    <aside class="sidebar">
      <a href="#" class="nav-item active">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fa-solid fa-square-plus"></i>
        <span>Create</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fa-solid fa-store"></i>
        <span>Store</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fa-regular fa-circle-user"></i>
        <span>Profile</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fa-solid fa-user-group"></i>
        <span>Friends</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Learn</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fa-solid fa-arrows-rotate"></i>
        <span>Subscribe</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fa-solid fa-gear"></i>
        <span>Settings</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fa-regular fa-circle-question"></i>
        <span>Help</span>
      </a>
    </aside>

    <main class="content-area">
      <!-- Your main page content goes here -->
    </main>
  </div>

</body>
</html>
