<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChordiFlip UI</title>
  
  <!-- Iconify Script -->
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&family=Shrikhand&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 12px 12px 0 12px;
    }

    /* --- MAIN TOP BAR HEADER --- */
    .top-bar {
      display: flex;
      align-items: center;
      height: 60px;
      width: 100%;
      gap: 12px;
    }

    /* --- LOGO CONTAINER --- */
    .logo-container {
      width: 220px;
      height: 100%;
      background-color: #212529;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Shrikhand', cursive !important;
      font-size: 29.5px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .logo span {
      font-family: 'Shrikhand', cursive !important;
    } 

    .logo span.chord { color: #ffffff; }
    .logo span.i { color: #ffde59; }  
    .logo span.flip { color: #6edad6; }

    /* --- FLOATING OUTER RIGHT BAR --- */
    .top-bar-right {
      flex: 1;
      height: 100%;
      background-color: #26262a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }

    /* --- INNER SEARCH PILL BOX --- */
    .search-bar {
      background-color: #3f4045;
      height: 42px;
      width: 380px;
      border-radius: 21px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #c5c6c9;
      font-size: 16px;
      font-weight: 400;
      width: 85%;
    }

    .search-bar input::placeholder {
      color: #9a9b9e;
    }

    .search-bar iconify-icon {
      font-size: 22px;
      color: #ffffff;
      flex-shrink: 0;
    }

    /* --- MAIN APP CONTAINER --- */
    .main-container {
      display: flex;
      flex: 1;
      padding: 12px 0;
      gap: 12px;
      min-height: 0;
    }

    /* --- FLOATING SIDEBAR --- */
    .sidebar {
      width: 196px;
      background-color: #2c2d30;
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      transition: background 0.2s;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .nav-item.active {
      background-color: #6c6d70;
    }

    .nav-item iconify-icon {
      font-size: 22px;
      color: #ffffff;
      flex-shrink: 0;
    }

    /* --- CONTENT AREA --- */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .page-view {
      display: none;
      height: 100%;
    }

    .page-view.active {
      display: block;
    }

    /* --- SUBVIEWS LAYOUT --- */
    .create-subview {
      display: none;
      height: 100%;
      width: 100%;
    }

    .create-subview.active {
      display: flex;
    }

    /* --- SCROLLABLE CREATE CONTAINER --- */
    .create-container {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 24px;
      padding: 4px 12px 24px 0;
      overflow-y: auto;
      max-height: 100%;
      width: 100%;

      /* Scrollbar styling */
      scrollbar-width: thin;
      scrollbar-color: #4f4f52 transparent;
    }

    .create-container::-webkit-scrollbar {
      width: 6px;
    }

    .create-container::-webkit-scrollbar-thumb {
      background-color: #4f4f52;
      border-radius: 10px;
    }

    .project-item {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .new-project-card, .saved-project-card {
      width: 140px;
      height: 140px;
      background-color: #4f4f52;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      flex-shrink: 0;
    }

    .saved-project-card {
      background-color: #27272a;
    }

    .new-project-card:hover, .saved-project-card:hover {
      transform: scale(1.02);
    }

    .new-project-card iconify-icon {
      font-size: 64px;
      color: #ffffff;
    }

    .saved-project-card iconify-icon {
      font-size: 58px;
      color: #6edad6;
    }

    .project-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .project-details .project-name {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
    }

    .project-details .project-date {
      font-size: 20px;
      font-weight: 600;
      color: #d1d2d5;
    }

    /* --- CENTERED FILE FORM CARD VIEW --- */
    #create-file-subview {
      align-items: center;
      justify-content: center;
    }

    .file-form-card {
      position: relative;
      background-color: #27272a;
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      height: auto;
      min-height: 260px;
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .file-form-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 18px;
    }

    .file-name-input {
      width: 100%;
      height: 52px;
      background-color: #4b4c50;
      border: none;
      outline: none;
      border-radius: 16px;
      padding: 0 22px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .file-name-input::placeholder {
      color: #b0b1b5;
      font-weight: 700;
    }

    .create-file-btn {
      align-self: flex-end;
      background-color: #2faf0a;
      color: #ffffff;
      border: none;
      outline: none;
      border-radius: 16px;
      padding: 12px 28px;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .create-file-btn:hover {
      background-color: #38c80d;
      transform: scale(1.02);
    }

    /* --- PIANO EDITOR VIEW --- */
    .piano-editor-card {
      position: relative;
      background-color: #535353;
      border-radius: 20px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .active-project-banner {
      position: absolute;
      top: 24px;
      left: 28px;
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.4);
      padding: 8px 18px;
      border-radius: 12px;
      z-index: 5;
    }

    .piano-keyboard-strip {
      width: 100%;
      height: 230px;
      background-color: #ffffff;
      position: relative;
      display: flex;
      touch-action: manipulation;
    }

    .white-key {
      flex: 1;
      height: 100%;
      border-right: 2px solid #2d2d2d;
      background-color: #ffffff;
      cursor: pointer;
      user-select: none;
    }

    .white-key:active, .white-key.active {
      background-color: #e0e0e0;
    }

    .white-key:last-child {
      border-right: none;
    }

    .black-key {
      position: absolute;
      top: 0;
      width: 9.8%;
      height: 60%;
      background-color: #000000;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      z-index: 2;
      cursor: pointer;
      user-select: none;
    }

    .black-key:active, .black-key.active {
      background-color: #333333;
    }

    .black-key.k1 { left: 9.3%; }
    .black-key.k2 { left: 23.6%; }
    .black-key.k3 { left: 52.2%; }
    .black-key.k4 { left: 66.5%; }
    .black-key.k5 { left: 80.8%; }

    /* =========================================================
       RESPONSIVE DESIGN: MOBILE PORTRAIT & LANDSCAPE
       ========================================================= */

    /* --- MOBILE PORTRAIT (Up to 768px wide) --- */
    @media (max-width: 768px) and (orientation: portrait) {
      body {
        padding: 8px;
      }

      .top-bar {
        height: 50px;
        gap: 8px;
      }

      .logo-container {
        width: 140px;
      }

      .logo {
        font-size: 20px;
      }

      .search-bar {
        width: 100%;
        height: 36px;
        padding: 0 10px;
      }

      .search-bar input {
        font-size: 14px;
      }

      .main-container {
        flex-direction: column-reverse;
        padding: 8px 0 0 0;
        gap: 8px;
      }

      .sidebar {
        width: 100%;
        height: 60px;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 6px 8px;
        border-radius: 14px;
        overflow-x: auto;
        flex-shrink: 0;
      }

      .nav-item {
        padding: 8px;
        border-radius: 10px;
      }

      .nav-item span {
        display: none;
      }

      .nav-item iconify-icon {
        font-size: 24px;
      }

      .active-project-banner {
        top: 12px;
        left: 12px;
        font-size: 15px;
        padding: 6px 12px;
      }

      .piano-keyboard-strip {
        height: 280px;
      }

      .file-form-card {
        width: 90%;
        padding: 24px;
      }

      .create-file-btn {
        width: 100%;
        font-size: 18px;
      }
    }

    /* --- MOBILE LANDSCAPE (Short screens) --- */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        padding: 6px;
      }

      .top-bar {
        height: 42px;
        gap: 8px;
      }

      .logo-container {
        width: 150px;
      }

      .logo {
        font-size: 20px;
      }

      .search-bar {
        height: 32px;
        width: 240px;
      }

      .main-container {
        padding: 6px 0 0 0;
        gap: 8px;
      }

      .sidebar {
        width: 58px;
        padding: 6px;
        border-radius: 14px;
      }

      .nav-item {
        justify-content: center;
        padding: 8px 0;
      }

      .nav-item span {
        display: none;
      }

      .active-project-banner {
        top: 8px;
        left: 12px;
        font-size: 14px;
        padding: 4px 10px;
      }

      .piano-keyboard-strip {
        height: 80%;
      }

      .file-form-card {
        padding: 20px;
        width: 85%;
      }

      .file-form-title {
        font-size: 18px;
        margin-bottom: 10px;
      }

      .file-name-input {
        height: 40px;
        font-size: 16px;
        margin-bottom: 14px;
      }

      .create-file-btn {
        padding: 8px 18px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar Header -->
  <header class="top-bar">
    <div class="logo-container">
      <div class="logo">
        <span class="chord">Chord</span><span class="i">i</span><span class="flip">Flip</span>
      </div>
    </div>

    <div class="top-bar-right">
      <div class="search-bar">
        <input type="text" id="main-search-input" placeholder="Search ChordiFlip">
        <iconify-icon icon="mingcute:search-line"></iconify-icon>
      </div>
    </div>
  </header>

  <!-- Main Area with Sidebar and Views -->
  <div class="main-container">
    <nav class="sidebar">
      <a href="#" class="nav-item active" data-target="home-view" data-placeholder="Search ChordiFlip">
        <iconify-icon icon="famicons:home"></iconify-icon>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item" data-target="create-view" data-placeholder="Search Projects">
        <iconify-icon icon="gridicons:create"></iconify-icon>
        <span>Create</span>
      </a>
      <a href="#" class="nav-item" data-target="store-view" data-placeholder="Search Store">
        <iconify-icon icon="material-symbols:store-rounded"></iconify-icon>
        <span>Store</span>
      </a>
      <a href="#" class="nav-item" data-target="profile-view" data-placeholder="Search Profile">
        <iconify-icon icon="gg:profile"></iconify-icon>
        <span>Profile</span>
      </a>
      <a href="#" class="nav-item" data-target="friends-view" data-placeholder="Search Friends">
        <iconify-icon icon="fa7-solid:user-friends"></iconify-icon>
        <span>Friends</span>
      </a>
      <a href="#" class="nav-item" data-target="learn-view" data-placeholder="Search Lessons">
        <iconify-icon icon="material-symbols:school-rounded"></iconify-icon>
        <span>Learn</span>
      </a>
      <a href="#" class="nav-item" data-target="subscribe-view" data-placeholder="Search Plans">
        <iconify-icon icon="streamline:subscription-cashflow-solid"></iconify-icon>
        <span>Subscribe</span>
      </a>
      <a href="#" class="nav-item" data-target="settings-view" data-placeholder="Search Settings">
        <iconify-icon icon="material-symbols:settings-rounded"></iconify-icon>
        <span>Settings</span>
      </a>
      <a href="#" class="nav-item" data-target="help-view" data-placeholder="Search Help">
        <iconify-icon icon="material-symbols:help-rounded"></iconify-icon>
        <span>Help</span>
      </a>
    </nav>

    <!-- Content Area Container -->
    <div class="content-area">
      <!-- 1. Home Page View -->
      <div id="home-view" class="page-view active"></div>

      <!-- 2. Create Page View -->
      <div id="create-view" class="page-view">
        <!-- Subview A: Scrollable Dynamic Project List View -->
        <div id="create-main-subview" class="create-container create-subview active"></div>

        <!-- Subview B: Centered File Name Input View -->
        <div id="create-file-subview" class="create-subview">
          <div class="file-form-card">
            <label class="file-form-title">Enter file name:</label>
            <input type="text" id="project-name-input" class="file-name-input" placeholder="File name">
            <button class="create-file-btn" id="submit-create-file-btn">Create file</button>
          </div>
        </div>

        <!-- Subview C: Piano Keyboard Editor View -->
        <div id="create-editor-subview" class="create-subview">
          <div class="piano-editor-card">
            <div id="current-project-title" class="active-project-banner">Project: Untitled</div>

            <div class="piano-keyboard-strip">
              <!-- White Keys (C4 to B4) -->
              <div class="white-key" data-freq="261.63"></div>
              <div class="white-key" data-freq="293.66"></div>
              <div class="white-key" data-freq="329.63"></div>
              <div class="white-key" data-freq="349.23"></div>
              <div class="white-key" data-freq="392.00"></div>
              <div class="white-key" data-freq="440.00"></div>
              <div class="white-key" data-freq="493.88"></div>

              <!-- Black Keys (C#4, D#4, F#4, G#4, A#4) -->
              <div class="black-key k1" data-freq="277.18"></div>
              <div class="black-key k2" data-freq="311.13"></div>
              <div class="black-key k3" data-freq="369.99"></div>
              <div class="black-key k4" data-freq="415.30"></div>
              <div class="black-key k5" data-freq="466.16"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript App Logic -->
  <script>
    const navItems = document.querySelectorAll('.nav-item');
    const pageViews = document.querySelectorAll('.page-view');
    const searchInput = document.getElementById('main-search-input');

    const submitCreateFileBtn = document.getElementById('submit-create-file-btn');
    const projectNameInput = document.getElementById('project-name-input');
    const currentProjectTitle = document.getElementById('current-project-title');
    
    const createMainSubview = document.getElementById('create-main-subview');
    const createFileSubview = document.getElementById('create-file-subview');
    const createEditorSubview = document.getElementById('create-editor-subview');

    let savedProjects = JSON.parse(localStorage.getItem('chordiflip_projects')) || [];

    function renderProjects() {
      createMainSubview.innerHTML = '';

      savedProjects.forEach(proj => {
        const item = document.createElement('div');
        item.className = 'project-item';
        item.innerHTML = `
          <div class="saved-project-card" data-id="${proj.id}">
            <iconify-icon icon="solar:music-note-bold"></iconify-icon>
          </div>
          <div class="project-details">
            <span class="project-name">${proj.name}</span>
            <span class="project-date">${proj.date}</span>
          </div>
        `;

        item.querySelector('.saved-project-card').addEventListener('click', () => {
          openPianoEditor(proj.name);
        });

        createMainSubview.appendChild(item);
      });

      const addCardItem = document.createElement('div');
      addCardItem.className = 'project-item';
      addCardItem.innerHTML = `
        <div class="new-project-card" id="add-project-btn">
          <iconify-icon icon="ic:round-add"></iconify-icon>
        </div>
        <div class="project-details">
          <span class="project-name">name</span>
          <span class="project-date">date created</span>
        </div>
      `;

      addCardItem.querySelector('#add-project-btn').addEventListener('click', () => {
        projectNameInput.value = '';
        createMainSubview.classList.remove('active');
        createFileSubview.classList.add('active');
        createEditorSubview.classList.remove('active');
      });

      createMainSubview.appendChild(addCardItem);
    }

    function openPianoEditor(title) {
      currentProjectTitle.textContent = `Project: ${title}`;
      createMainSubview.classList.remove('active');
      createFileSubview.classList.remove('active');
      createEditorSubview.classList.add('active');
    }

    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();

        navItems.forEach(nav => nav.classList.remove('active'));
        item.classList.add('active');

        const targetId = item.getAttribute('data-target');
        pageViews.forEach(view => view.classList.remove('active'));

        const targetView = document.getElementById(targetId);
        if (targetView) {
          targetView.classList.add('active');
        }

        if (targetId === 'create-view') {
          renderProjects();
          createMainSubview.classList.add('active');
          createFileSubview.classList.remove('active');
          createEditorSubview.classList.remove('active');
        }

        const newPlaceholder = item.getAttribute('data-placeholder');
        if (newPlaceholder) {
          searchInput.placeholder = newPlaceholder;
        }
      });
    });

    submitCreateFileBtn.addEventListener('click', () => {
      const fileName = projectNameInput.value.trim() || 'Untitled Project';
      
      const formattedDate = new Date().toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });

      const newProject = {
        id: Date.now(),
        name: fileName,
        date: formattedDate
      };

      savedProjects.push(newProject);
      localStorage.setItem('chordiflip_projects', JSON.stringify(savedProjects));

      renderProjects();
      openPianoEditor(fileName);
    });

    // Web Audio Synthesizer Engine
    let audioCtx = null;

    function playNote(frequency) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 1.2);
    }

    const allKeys = document.querySelectorAll('.white-key, .black-key');
    
    function triggerKey(e, key) {
      e.stopPropagation();
      e.preventDefault();
      const freq = parseFloat(key.getAttribute('data-freq'));
      if (freq) playNote(freq);
    }

    allKeys.forEach(key => {
      key.addEventListener('touchstart', (e) => triggerKey(e, key), { passive: false });
      key.addEventListener('mousedown', (e) => triggerKey(e, key));
    });

    renderProjects();
  </script>
</body>
</html>
