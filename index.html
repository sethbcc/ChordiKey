<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChordiFlip UI</title>
  
  <!-- Iconify Script -->
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&family=Shrikhand&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 12px 12px 0 0;
    }

    /* --- MAIN TOP BAR HEADER --- */
    .top-bar {
      display: flex;
      align-items: center;
      height: 60px;
      width: 100%;
      gap: 12px;
      padding-left: 0;
    }

    /* --- LOGO CONTAINER --- */
    .logo-container {
      width: 220px;
      height: 100%;
      background-color: #212529;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0 12px 12px 0;
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Shrikhand', cursive !important;
      font-size: 29.5px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .logo span {
      font-family: 'Shrikhand', cursive !important;
    } 

    .logo span.chord { color: #ffffff; }
    .logo span.i { color: #ffde59; }  
    .logo span.flip { color: #6edad6; }

    /* --- FLOATING OUTER RIGHT BAR --- */
    .top-bar-right {
      flex: 1;
      height: 100%;
      background-color: #26262a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }

    /* --- INNER SEARCH PILL BOX --- */
    .search-bar {
      background-color: #3f4045;
      height: 42px;
      width: 380px;
      border-radius: 21px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #c5c6c9;
      font-size: 16px;
      font-weight: 400;
      width: 85%;
    }

    .search-bar input::placeholder {
      color: #9a9b9e;
    }

    .search-bar iconify-icon {
      font-size: 22px;
      color: #ffffff;
      flex-shrink: 0;
    }

    /* --- MAIN APP CONTAINER --- */
    .main-container {
      display: flex;
      flex: 1;
      padding: 12px 0 12px 12px;
    }

    /* --- FLOATING SIDEBAR --- */
    .sidebar {
      width: 196px;
      background-color: #2c2d30;
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      transition: background 0.2s;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .nav-item.active {
      background-color: #6c6d70;
    }

    .nav-item iconify-icon {
      font-size: 22px;
      color: #ffffff;
      flex-shrink: 0;
    }

    /* --- CONTENT AREA & VISIBILITY TOGGLE --- */
    .content-area {
      flex: 1;
      padding-left: 20px;
    }

    .page-view {
      display: none;
    }

    .page-view.active {
      display: block;
    }

    /* --- CREATE PAGE LAYOUT --- */
    .create-container {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-top: 4px;
    }

    .new-project-card {
      width: 140px;
      height: 140px;
      background-color: #4f4f52;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .new-project-card:hover {
      background-color: #5d5e62;
      transform: scale(1.02);
    }

    .new-project-card iconify-icon {
      font-size: 64px;
      color: #ffffff;
    }

    .project-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .project-details .project-name {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
    }

    .project-details .project-date {
      font-size: 20px;
      font-weight: 600;
      color: #d1d2d5;
    }
  </style>
</head>
<body>

  <!-- Top Bar Header -->
  <header class="top-bar">
    <div class="logo-container">
      <div class="logo">
        <span class="chord">Chord</span><span class="i">i</span><span class="flip">Flip</span>
      </div>
    </div>

    <div class="top-bar-right">
      <div class="search-bar">
        <input type="text" id="main-search-input" placeholder="Search ChordiFlip">
        <iconify-icon icon="mingcute:search-line"></iconify-icon>
      </div>
    </div>
  </header>

  <!-- Main Area with Sidebar and Views -->
  <div class="main-container">
    <nav class="sidebar">
      <a href="#" class="nav-item active" data-target="home-view" data-placeholder="Search ChordiFlip">
        <iconify-icon icon="famicons:home"></iconify-icon>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item" data-target="create-view" data-placeholder="Search Projects">
        <iconify-icon icon="gridicons:create"></iconify-icon>
        <span>Create</span>
      </a>
      <a href="#" class="nav-item" data-target="store-view" data-placeholder="Search Store">
        <iconify-icon icon="material-symbols:store-rounded"></iconify-icon>
        <span>Store</span>
      </a>
      <a href="#" class="nav-item" data-target="profile-view" data-placeholder="Search Profile">
        <iconify-icon icon="gg:profile"></iconify-icon>
        <span>Profile</span>
      </a>
      <a href="#" class="nav-item" data-target="friends-view" data-placeholder="Search Friends">
        <iconify-icon icon="fa7-solid:user-friends"></iconify-icon>
        <span>Friends</span>
      </a>
      <a href="#" class="nav-item" data-target="learn-view" data-placeholder="Search Lessons">
        <iconify-icon icon="material-symbols:school-rounded"></iconify-icon>
        <span>Learn</span>
      </a>
      <a href="#" class="nav-item" data-target="subscribe-view" data-placeholder="Search Plans">
        <iconify-icon icon="streamline:subscription-cashflow-solid"></iconify-icon>
        <span>Subscribe</span>
      </a>
      <a href="#" class="nav-item" data-target="settings-view" data-placeholder="Search Settings">
        <iconify-icon icon="material-symbols:settings-rounded"></iconify-icon>
        <span>Settings</span>
      </a>
      <a href="#" class="nav-item" data-target="help-view" data-placeholder="Search Help">
        <iconify-icon icon="material-symbols:help-rounded"></iconify-icon>
        <span>Help</span>
      </a>
    </nav>

    <!-- Content Area Container -->
    <div class="content-area">
      <!-- 1. Home Page View -->
      <div id="home-view" class="page-view active"></div>

      <!-- 2. Create Page View -->
      <div id="create-view" class="page-view">
        <div class="create-container">
          <div class="new-project-card">
            <iconify-icon icon="ic:round-add"></iconify-icon>
          </div>
          <div class="project-details">
            <span class="project-name">name</span>
            <span class="project-date">date created</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Page Navigation JavaScript -->
  <script>
    const navItems = document.querySelectorAll('.nav-item');
    const pageViews = document.querySelectorAll('.page-view');
    const searchInput = document.getElementById('main-search-input');

    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();

        // 1. Set Active Link Highlight
        navItems.forEach(nav => nav.classList.remove('active'));
        item.classList.add('active');

        // 2. Switch Dynamic Page View
        const targetId = item.getAttribute('data-target');
        pageViews.forEach(view => view.classList.remove('active'));

        const targetView = document.getElementById(targetId);
        if (targetView) {
          targetView.classList.add('active');
        }

        // 3. Update Search Placeholder Text
        const newPlaceholder = item.getAttribute('data-placeholder');
        if (newPlaceholder) {
          searchInput.placeholder = newPlaceholder;
        }
      });
    });
  </script>
</body>
</html>
